<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f4a2c" />
    <meta name="description" content="The Last Garden – ein gemütliches Garten-Abenteuer am Rand einer vergessenen Stadt." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Garden" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>The Last Garden</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #1f2e1d;
        color: #f4efe3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      #safe-area-probe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      }
      #app-loader,
      #app-error {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: calc(24px + var(--safe-top)) calc(24px + var(--safe-right)) calc(24px + var(--safe-bottom))
          calc(24px + var(--safe-left));
        background: #1f2e1d;
        text-align: center;
        transition: opacity 0.25s ease;
      }
      #app-loader.is-hidden,
      #app-error[hidden] {
        display: none;
      }
      #app-loader.is-fading {
        opacity: 0;
        pointer-events: none;
      }
      .tlg-emblem {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        animation: tlg-pulse 1.8s ease-in-out infinite;
      }
      .tlg-title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .tlg-sub {
        margin: 0;
        font-size: 14px;
        opacity: 0.82;
        max-width: 320px;
        line-height: 1.45;
      }
      .tlg-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 4px;
      }
      .tlg-btn {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: #e9a23b;
        color: #1f2e1d;
      }
      .tlg-btn.secondary {
        background: rgba(244, 239, 227, 0.14);
        color: #f4efe3;
      }
      #pwa-toast-root {
        position: fixed;
        left: calc(12px + var(--safe-left));
        right: calc(12px + var(--safe-right));
        bottom: calc(14px + var(--safe-bottom));
        z-index: 150;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }
      .tlg-pill {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 420px;
        padding: 8px 12px 8px 14px;
        border-radius: 999px;
        background: rgba(31, 46, 29, 0.94);
        border: 1px solid rgba(244, 239, 227, 0.2);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        font-size: 13px;
        line-height: 1.3;
        color: #f4efe3;
      }
      .tlg-pill button {
        border: 0;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        background: #e9a23b;
        color: #1f2e1d;
      }
      .tlg-pill button.tlg-close {
        padding: 4px 8px;
        background: transparent;
        color: rgba(244, 239, 227, 0.72);
        font-size: 16px;
        line-height: 1;
      }
      @keyframes tlg-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.95;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-area-probe"></div>

    <div id="app-loader" role="status" aria-live="polite">
      <img class="tlg-emblem" src="./icons/icon.svg" alt="" width="72" height="72" />
      <h1 class="tlg-title">The Last Garden</h1>
      <p class="tlg-sub">Garten wird geladen …</p>
      <noscript>
        <p class="tlg-sub">Bitte aktiviere JavaScript, um The Last Garden zu spielen.</p>
      </noscript>
    </div>

    <div id="app-error" role="alert" hidden>
      <img class="tlg-emblem" src="./icons/icon.svg" alt="" width="72" height="72" />
      <h1 class="tlg-title">Laden fehlgeschlagen</h1>
      <p class="tlg-sub" id="app-error-msg">Das Spiel konnte nicht gestartet werden.</p>
      <div class="tlg-actions">
        <button class="tlg-btn" id="app-retry-btn" type="button">Erneut laden</button>
        <button class="tlg-btn secondary" id="app-reset-cache-btn" type="button">Cache zurücksetzen</button>
      </div>
    </div>

    <div id="pwa-toast-root" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
